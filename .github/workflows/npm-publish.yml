name: Publish client
on:
  push:
    branches: [main]
    paths: [packages/client/package.json]
  workflow_dispatch:
permissions: {}
concurrency:
  group: publish-client
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install_args: bun node
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0.9"
          bundler-cache: true
          working-directory: packages/app-capacitor
      - run: bun install --frozen-lockfile
      - id: version
        run: bun run release:plan --github-output
      - if: steps.version.outputs.publish == 'true'
        run: bun run verify
        env:
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
      - if: steps.version.outputs.publish == 'true'
        name: Wait for deployed collector and private admin
        timeout-minutes: 12
        run: bun scripts/deploy/collectorReady.ts
      - if: steps.version.outputs.publish == 'true'
        working-directory: packages/client
        run: |
          mkdir -p ../../dist
          bun pm pack --destination ../../dist
      - if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-package
          path: dist/*.tgz
          if-no-files-found: error
          archive: true
          include-hidden-files: false
          overwrite: false
  publish:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-package
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - run: npm publish ./dist/*.tgz --access public --ignore-scripts

name: Publish client
on:
  push:
    branches: [main]
    paths: [packages/client/package.json]
  workflow_dispatch:
permissions: {}
concurrency:
  group: publish-client
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun node
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0.7"
          bundler-cache: true
          working-directory: packages/app-capacitor
      - run: bun install --frozen-lockfile
      - id: version
        run: bun run release:plan --github-output
      - if: steps.version.outputs.publish == 'true'
        run: bun run verify
        env:
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
      - if: steps.version.outputs.publish == 'true'
        name: Wait for deployed collector and private admin
        timeout-minutes: 12
        run: bun scripts/deploy/collectorReady.ts
      - if: steps.version.outputs.publish == 'true'
        working-directory: packages/client
        run: |
          mkdir -p ../../dist
          bun pm pack --destination ../../dist
      - if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-package
          path: dist/*.tgz
          if-no-files-found: error
  publish:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-package
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: npm publish ./dist/*.tgz --access public --ignore-scripts

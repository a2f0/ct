name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install_args: bun node
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0.9"
          bundler-cache: true
          working-directory: packages/app-capacitor
      - run: bun install --frozen-lockfile
      - name: Validate the actual branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bun run lint:branch-name "$BRANCH_NAME"
      - run: bun run check
      - run: bun run test
        env:
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
      - run: bun run build
      - name: Sync the native projects without changing them
        run: |
          bun run mobile:sync
          native_paths=(packages/app-capacitor/ios packages/app-capacitor/android)
          test -z "$(git status --porcelain -- "${native_paths[@]}")" || {
            git status --short -- "${native_paths[@]}"
            exit 1
          }
      - run: bun run package:smoke
      - run: bun run test:extension
      - run: bunx --no-install playwright install --with-deps chromium firefox
      - run: bun run test:browser
